name: Tests

on:
  push:
    branches: [master, main]
    paths: ['scripts/**', 'tests/**', '.github/workflows/tests.yml']
  pull_request:
    branches: [master, main]
    paths: ['scripts/**', 'tests/**', '.github/workflows/tests.yml']

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: pytest -q
