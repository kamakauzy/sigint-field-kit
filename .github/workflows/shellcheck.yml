name: ShellCheck

on:
  push:
    branches: [master, main]
    paths: ['*.sh', '**/*.sh']
  pull_request:
    branches: [master, main]
    paths: ['*.sh', '**/*.sh']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on install.sh
        run: shellcheck -s bash -e SC2086,SC2034 install.sh

      - name: Run ShellCheck on verify-setup.sh
        run: shellcheck -s bash -e SC2086,SC2034 verify-setup.sh
